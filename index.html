<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Marketplace - ตลาดกลางสัตว์เลี้ยง</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-bold text-blue-400">PetMarket</span>
        <span class="text-xs bg-blue-900 text-blue-200 px-2 py-1 rounded">Beta</span>
      </div>
      <div class="flex space-x-3">
        <button id="open-modal-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition flex items-center space-x-1 shadow">
          <span>+ ลงประกาศ</span>
        </button>
        <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">
          เข้าสู่ระบบ / ลงทะเบียน
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="bg-gradient-to-r from-slate-900 to-slate-800 text-white py-12 px-4">
    <div class="max-w-4xl mx-auto text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold mb-3">ตลาดกลางซื้อขายสัตว์เลี้ยงที่ปลอดภัย 100%</h1>
      <p class="text-slate-300 text-sm md:text-base mb-6">มีระบบยืนยันตัวตนผู้ขาย (KYC) ระบบคนกลางพักเงิน (Escrow) และการบันทึกประวัติสายเลือด/สุขภาพ</p>
      <div class="inline-flex rounded-md shadow-sm">
        <input type="text" placeholder="ค้นหาสายพันธุ์, มอร์ฟ (เช่น Amel Zulu, Sulcata)..." class="w-64 md:w-80 px-4 py-2 text-slate-900 rounded-l-lg focus:outline-none text-sm">
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-r-lg font-medium text-sm">ค้นหา</button>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-slate-900">รายการสัตว์เลี้ยงมาใหม่</h2>
      <span class="text-xs text-slate-500">เชื่อมต่อระบบฐานข้อมูล Supabase Live Data</span>
    </div>

    <!-- Pet Grid Container -->
    <div id="pet-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="col-span-full text-center py-12 text-slate-400 text-sm">
        กำลังเชื่อมต่อฐานข้อมูล...
      </div>
    </div>
  </main>

  <!-- Modal สำหรับลงประกาศสัตว์เลี้ยง -->
  <div id="add-pet-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden my-8">
      <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
        <h3 class="font-bold text-lg">ลงประกาศขายสัตว์เลี้ยง</h3>
        <button id="close-modal-btn" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>
      
      <form id="add-pet-form" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">ชื่อหัวข้อประกาศ *</label>
          <input type="text" id="title" required placeholder="เช่น African Fat-tailed Gecko สายพันธุ์แท้" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">หมวดหมู่/ชนิด *</label>
            <select id="species" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="Gecko">Gecko (ตุ๊กแก)</option>
              <option value="Tortoise">Tortoise (เต่าบก)</option>
              <option value="Frog">Frog (กบ)</option>
              <option value="Cat">Cat (แมว)</option>
              <option value="Other">อื่นๆ</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">ราคา (บาท) *</label>
            <input type="number" id="price" required placeholder="เช่น 15000" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">มอร์ฟ (Morph) / สายพันธุ์</label>
            <input type="text" id="morph" placeholder="เช่น White Out Amel Zulu" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">สถานะสุขภาพ</label>
            <input type="text" id="health_status" value="สมบูรณ์แข็งแรง" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">URL รูปภาพสัตว์เลี้ยง (URL รูปภาพ .jpg / .png)</label>
          <input type="url" id="image_url" placeholder="https://example.com/image.jpg" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">รายละเอียดเพิ่มเติม</label>
          <textarea id="description" rows="3" placeholder="ระบุประวัติการกิน คราบ เพศ หรือรายละเอียดสายเลือด..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>

        <div class="pt-3 flex justify-end space-x-3 border-t border-slate-100">
          <button type="button" id="cancel-btn" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 text-sm font-medium hover:bg-slate-50 transition">ยกเลิก</button>
          <button type="submit" id="submit-btn" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-bold shadow transition">บันทึกประกาศ</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vrkxmlzsbxgoboulfgos.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZya3htbHpzYnhnb2JvdWxmb2dzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzk3NDUsImV4cCI6MjEwMDY1NTc0NX0.2ZbPyeqT-oLtKegqgmHMQx70x1BWhLWXc5p2jySspiQ';

    const modal = document.getElementById('add-pet-modal');
    const openModalBtn = document.getElementById('open-modal-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const addPetForm = document.getElementById('add-pet-form');
    const petGrid = document.getElementById('pet-grid');

    openModalBtn.addEventListener('click', () => { modal.classList.remove('hidden'); modal.classList.add('flex'); });
    const closeModal = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); addPetForm.reset(); };
    closeModalBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);

    async function fetchPets() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/pets?select=*&order=created_at.desc`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!response.ok) {
          const errData = await response.json();
          petGrid.innerHTML = `<div class="col-span-full bg-red-50 text-red-600 p-4 rounded-lg text-center text-sm">ข้อผิดพลาดจากฐานข้อมูล: ${errData.message || response.statusText}</div>`;
          return;
        }

        const pets = await response.json();

        if (!pets || pets.length === 0) {
          petGrid.innerHTML = `
            <div class="col-span-full bg-white p-8 rounded-xl border border-dashed border-slate-300 text-center">
              <p class="text-slate-800 font-bold mb-1">ยังไม่มีรายการสัตว์เลี้ยงในระบบ</p>
              <p class="text-xs text-slate-500">กดปุ่ม "+ ลงประกาศ" ด้านบน เพื่อเพิ่มสัตว์เลี้ยงตัวแรกได้เลยครับ</p>
            </div>
          `;
          return;
        }

        petGrid.innerHTML = pets.map(pet => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="h-48 bg-slate-100 flex items-center justify-center text-slate-400 overflow-hidden">
                ${pet.images && pet.images.length > 0 && pet.images[0]
                  ? `<img src="${pet.images[0]}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\"text-xs text-slate-400\">รูปภาพไม่ถูกต้อง</span>';">` 
                  : '<span class="text-xs">ไม่มีรูปภาพ</span>'}
              </div>
              <div class="p-4">
                <div class="flex justify-between items-start mb-2">
                  <span class="text-xs font-bold uppercase bg-blue-50 text-blue-600 px-2 py-0.5 rounded">${pet.species || 'ไม่ระบุ'}</span>
                  <span class="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded font-medium">${pet.health_status || 'ปกติ'}</span>
                </div>
                <h3 class="font-bold text-slate-900 text-base mb-1 line-clamp-1">${pet.title || 'ไม่มีชื่อหัวข้อ'}</h3>
                <p class="text-xs text-slate-500 mb-3">${pet.morph ? 'Morph: ' + pet.morph : 'ไม่มีระบุมอร์ฟ'}</p>
              </div>
            </div>
            <div class="p-4 pt-0">
              <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                <span class="text-lg font-extrabold text-blue-600">฿${pet.price ? Number(pet.price).toLocaleString() : '0'}</span>
                <button class="text-xs bg-slate-900 text-white px-3 py-1.5 rounded-lg hover:bg-slate-800 transition">รายละเอียด</button>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        petGrid.innerHTML = `<div class="col-span-full text-red-500 text-center text-sm">เกิดข้อผิดพลาดในการดึงข้อมูล: ${err.message}</div>`;
      }
    }

    addPetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'กำลังบันทึก...';

      const imageUrl = document.getElementById('image_url').value.trim();
      
      const payload = {
        title: document.getElementById('title').value.trim(),
        species: document.getElementById('species').value,
        price: parseFloat(document.getElementById('price').value),
        morph: document.getElementById('morph').value.trim() || null,
        health_status: document.getElementById('health_status').value.trim() || 'สมบูรณ์แข็งแรง',
        description: document.getElementById('description').value.trim() || null,
        images: imageUrl ? [imageUrl] : []
      };

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/pets`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errData = await response.json();
          alert(`เกิดข้อผิดพลาดในการบันทึก: ${errData.message || response.statusText}`);
        } else {
          closeModal();
          fetchPets();
        }
      } catch (err) {
        alert(`เกิดข้อผิดพลาดในการเชื่อมต่อ: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'บันทึกประกาศ';
      }
    });

    document.addEventListener('DOMContentLoaded', fetchPets);
  </script>
</body>
</html>
