<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // สคริปต์แปลงเส้นทางและดึง Token จาก URL ของ Supabase กลับเข้าสู่หน้าหลักโดยอัตโนมัติ
    const targetUrl = window.location.origin + '/index.html' + window.location.search + window.location.hash;
    window.location.replace(targetUrl);
  </script>
</head>
<body>
  <div style="text-align:center; margin-top:100px; font-family:sans-serif; color:#475569;">
    <h3>กำลังพาคุณไปยังหน้าเปลี่ยนรหัสผ่าน...</h3>
  </div>
</body>
</html>
