<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // ดึงเส้นทางและรักษาพารามิเตอร์ Token ของ Supabase ให้อยู่ใต้ path /pet-marketplace/
    const basePath = '/pet-marketplace';
    const targetUrl = window.location.origin + basePath + '/index.html' + window.location.search + window.location.hash;
    window.location.replace(targetUrl);
  </script>
</head>
<body>
  <div style="text-align:center; margin-top:100px; font-family:sans-serif; color:#475569;">
    <h3>กำลังพาคุณไปยังหน้าเปลี่ยนรหัสผ่าน...</h3>
  </div>
</body>
</html>
