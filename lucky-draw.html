    <style>
        body { font-family: 'Prompt', sans-serif; }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto;
        }
        @media (min-width: 640px) {
            .wheel-container { width: 380px; height: 380px; }
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            /* ใช้ตัวแปร --final-rotate ควบคุมองศาโดยตรง แม่นยำที่สุด */
            transform: rotate(var(--final-rotate, 0deg));
            transition: transform 4s cubic-bezier(0.15, 0.95, 0.15, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 8px solid #059669;
        }
        .pointer {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #DC2626;
            z-index: 50;
            filter: drop-shadow(0 3px 2px rgba(0,0,0,0.3));
        }
        .wheel-slice {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            transform-origin: left center;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 30px;
        }
    </style>
